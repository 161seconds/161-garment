<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký Tài Khoản | ONE61 GARMENTORY</title>
    <!-- Google Fonts: Be Vietnam Pro & Inter with 100% Native Vietnamese Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome 6 Pro -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Dedicated Modular Stylesheets -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
</head>

<body class="auth-page d-flex flex-column min-vh-100">
    <nav class="navbar navbar-light bg-white border-bottom py-3">
        <div class="container text-center justify-content-center">
            <a class="brand-logo-wrap" href="index.html">
                <span class="brand-box">ONE61</span>
                <span class="brand-box">GARMENTORY</span>
            </a>
        </div>
    </nav>

    <main class="container my-5 flex-grow-1">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-6">
                <div class="auth-card">
                    <div class="text-center mb-4">
                        <span class="badge bg-danger rounded-0 px-2 py-1 mb-2 text-uppercase" style="letter-spacing: 1px;">ONE61 Garmentory</span>
                        <h3 class="fw-bold text-uppercase tracking-wide m-0">ĐĂNG KÝ TÀI KHOẢN</h3>
                        <p class="text-muted small mt-1">Tạo tài khoản thành viên để nhận voucher giảm giá 10%</p>
                    </div>

                    <form onsubmit="handleRegister(event)">
                        <div class="row g-3">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold small text-uppercase">Tên đăng nhập <span class="text-danger">*</span></label>
                                <input type="text" id="regUser" class="form-control" placeholder="VD: user123" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold small text-uppercase">Họ và tên <span class="text-danger">*</span></label>
                                <input type="text" id="regName" class="form-control" placeholder="VD: Nguyễn Văn A" required>
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label fw-bold small text-uppercase">Địa chỉ Email <span class="text-danger">*</span></label>
                            <input type="email" id="regEmail" class="form-control" placeholder="name@example.com" required>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label fw-bold small text-uppercase">Số điện thoại</label>
                            <input type="tel" id="regPhone" class="form-control" placeholder="09xxxxxxxx">
                        </div>

                        <div class="row g-3">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold small text-uppercase">Mật khẩu <span class="text-danger">*</span></label>
                                <input type="password" id="regPass" class="form-control" placeholder="Nhập mật khẩu" required>
                            </div>
                            <div class="col-md-6 mb-4">
                                <label class="form-label fw-bold small text-uppercase">Xác nhận mật khẩu <span class="text-danger">*</span></label>
                                <input type="password" id="regConfirm" class="form-control" placeholder="Nhập lại mật khẩu" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-brand-primary w-100 py-3 mb-3">
                            ĐĂNG KÝ TÀI KHOẢN
                        </button>
                        <div class="text-center pt-2 border-top">
                            <span class="text-muted small">Đã có tài khoản?</span> 
                            <a href="login.html" class="text-danger text-decoration-none fw-bold small text-uppercase ms-1">Đăng nhập</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-white border-top text-dark py-4 mt-auto text-center small text-secondary">
        © 2026 ONE61 GARMENTORY. All Rights Reserved.
    </footer>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Dedicated Modular JS -->
    <script src="js/one61-alert.js"></script>
    <script src="js/main.js"></script>
    <script src="js/auth.js"></script>
</body>

</html>

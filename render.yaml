services:
  - type: web
    name: 161-garment
    runtime: docker
    plan: free
    region: singapore
    envVars:
      - key: SEPAY_API_TOKEN
        sync: false
      - key: SEPAY_WEBHOOK_SECRET
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: 1433
      - key: DB_NAME
        value: PRJ301_Ecommerce
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
